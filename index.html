<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Vacante para operario/a de producción en ALIGRI, Calarcá, Quindío." />
  <title>Vacante Operario/a de Producción | ALIGRI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f3f3f1; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .vacante {
      display: block;
      width: min(100%, 720px);
      text-decoration: none;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 32px rgba(0,0,0,.14);
      background: white;
      -webkit-tap-highlight-color: transparent;
    }
    .vacante img {
      width: 100%;
      height: auto;
      display: block;
    }
    .hint {
      padding: 12px 16px 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #445125;
      background: #fff;
    }
    @media (max-width: 520px) {
      body { padding: 0; background: #fff; }
      .vacante { width: 100%; border-radius: 0; box-shadow: none; }
      .hint { font-size: 13px; }
    }
  </style>
</head>
<body>
  <a
    class="vacante"
    href="https://wa.me/573234373636?text=Hola%21%20estoy%20interesado%20en%20la%20vacante%20laboral%20para%20operario%2Fa%20de%20producci%C3%B3n"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Postularme por WhatsApp a la vacante de operario o operaria de producción"
  >
    <img src="vacante-aligri.png" alt="Vacante ALIGRI para operario/a de producción" />
    <div class="hint">Toca la imagen para postularte por WhatsApp</div>
  </a>
</body>
</html>
